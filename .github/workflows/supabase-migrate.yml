# Applies pending Supabase migrations on every push to main that touches
# supabase/migrations/ (and on manual runs). Migrations are idempotent, so
# this is safe to run against a database that was set up by hand.
#
# One-time setup (GitHub > repo > Settings > Secrets and variables > Actions):
#   SUPABASE_ACCESS_TOKEN  https://supabase.com/dashboard/account/tokens
#   SUPABASE_DB_PASSWORD   database password (Project Settings > Database)
#   SUPABASE_PROJECT_ID    pksccdcijtgsgtemaclo
#
# The existing migrations only use IF NOT EXISTS / DROP ... IF EXISTS, so the
# first run adopts the current schema without dropping data.

name: Supabase migrations

on:
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/**'
      - '.github/workflows/supabase-migrate.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase-migrations
  cancel-in-progress: false

jobs:
  push:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
    steps:
      - name: Check required secrets
        run: |
          missing=0
          for name in SUPABASE_ACCESS_TOKEN SUPABASE_DB_PASSWORD SUPABASE_PROJECT_ID; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing GitHub secret: $name"
              missing=1
            fi
          done
          exit $missing

      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link project
        run: supabase link --project-ref "$SUPABASE_PROJECT_ID"

      - name: Push migrations
        run: supabase db push
