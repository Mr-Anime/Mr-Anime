name = "mr-anime"
main = ".open-next/worker.js"
compatibility_date = "2026-10-26"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = ".open-next/assets"
binding = "ASSETS"

[observability]
enabled = true

[vars]
# ---- Streaming providers ----
PROVIDER_1_BASE = "https://megaplay.buzz/stream/ani/{id}/{ep}/{lang}"
PROVIDER_1_NAME = "MegaPlay"

PROVIDER_2_BASE = "https://anixo.buzz/embed/ani/{id}/{ep}"
PROVIDER_2_NAME = "Anixo"

PROVIDER_3_BASE = "https://vidnest.fun/anime/{id}/{ep}/{lang}"
PROVIDER_3_NAME = "VidNest"

PROVIDER_4_BASE = "https://tryembed.us.cc/embed/anime/{id}/{ep}/{lang}"
PROVIDER_4_NAME = "TryEmbed"

# VidRift - free embed API (https://vidrift.net/docs); subtitles only
PROVIDER_5_BASE = "https://embed.vidrift.net/embed/tv/{tmdb}/{season}/{ep}"
PROVIDER_5_NAME = "VidRift"
PROVIDER_5_SUBONLY = "1"

