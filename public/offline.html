<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#09090b" />
    <title>Offline — Mr.Anime</title>
    <style>
      * { box-sizing: border-box; margin: 0; }
      body {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #09090b;
        color: #e4e4e7;
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
        padding: 24px;
      }
      .card {
        max-width: 420px;
        width: 100%;
        text-align: center;
        border: 1px solid rgba(63, 63, 70, 0.6);
        border-radius: 16px;
        background: #101013;
        padding: 40px 28px;
      }
      h1 { font-size: 1.4rem; margin-bottom: 10px; }
      p { color: #a1a1aa; font-size: 0.95rem; line-height: 1.55; margin-bottom: 22px; }
      button {
        appearance: none;
        border: 0;
        border-radius: 10px;
        background: #38bdf8;
        color: #061018;
        font-weight: 700;
        font-size: 0.95rem;
        padding: 10px 22px;
        cursor: pointer;
      }
      button:hover { background: #7dd3fc; }
      .m { color: #38bdf8; font-weight: 800; }
    </style>
  </head>
  <body>
    <div class="card">
      <h1><span class="m">Mr.</span>Anime — offline</h1>
      <p>
        Aapni offline achen ebong ei page-ta network charhe load korte parina.
        Internet connection check kore abar try korun.
      </p>
      <button onclick="location.reload()">Try again</button>
    </div>
  </body>
</html>
